name: Update Languages Card

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate card using API
        run: |
          curl -o public/languages-card.svg \
            "https://github-languages-card.vercel.app/api/top-languages?username=VIDAKHOSHPEY22&theme=pink"

      - name: Commit & Push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add public/languages-card.svg
          
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          
          git commit -m "chore: auto-update languages card [skip ci]"
          git push