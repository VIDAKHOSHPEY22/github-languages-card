<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="500" height="220" viewBox="0 0 500 220" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fef2f6"/>
      <stop offset="100%" style="stop-color:#fce7f3"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f47ba1"/>
      <stop offset="100%" style="stop-color:#e85d8e"/>
    </linearGradient>
    <linearGradient id="accentSoftGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#faaac4"/>
      <stop offset="100%" style="stop-color:#f47ba1"/>
    </linearGradient>
    <filter id="softShadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
    <filter id="avatarGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="avatarClip">
      <circle cx="42" cy="45" r="20"/>
    </clipPath>
  </defs>
  
  <!-- Background - fills entire SVG -->
  <rect x="0" y="0" width="500" height="220" rx="16" fill="url(#bgGrad)" filter="url(#softShadow)"/>
  
  <!-- Border accent - using calculated fixed values -->
  <rect x="1.5" y="1.5" width="497" height="217" rx="14.5" fill="none" stroke="url(#accentGrad)" stroke-width="0.8" opacity="0.25"/>
  
  <rect x="0" y="0" width="500" height="3" rx="1.5" fill="url(#accentGrad)">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" fill="freeze"/>
  </rect>

  <g>
    <circle cx="42" cy="45" r="24" fill="url(#accentGrad)" opacity="0.15" filter="url(#avatarGlow)">
      <animate attributeName="r" values="24;27;24" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="42" cy="45" r="20" fill="#ffffff" stroke="url(#accentSoftGrad)" stroke-width="2"/>
    <image href="data:image/jpeg;base64," x="22" y="25" width="40" height="40" clip-path="url(#avatarClip)" preserveAspectRatio="xMidYMid slice"/>
  </g>

