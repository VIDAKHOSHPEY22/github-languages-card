<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="160" viewBox="0 0 480 160">
  <defs>
    <linearGradient id="errorGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f47ba1"/>
      <stop offset="100%" stop-color="#e85d8e"/>
    </linearGradient>
    <linearGradient id="errorBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fce7f3"/>
    </linearGradient>
    <filter id="errorShadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
  </defs>
  <rect width="480" height="160" rx="12" fill="url(#errorBg)" filter="url(#errorShadow)"/>
  <rect x="0" y="0" width="480" height="3" rx="1.5" fill="url(#errorGradient)"/>
  <rect x="1" y="1" width="478" height="158" rx="11" fill="none" stroke="#f47ba1" stroke-width="0.5" opacity="0.2"/>
  <circle cx="40" cy="75" r="20" fill="#f47ba1" opacity="0.1"/>
  <text x="40" y="81" fill="#f47ba1" font-size="20" text-anchor="middle" font-family="'SF Mono', monospace" font-weight="700">!</text>
  <text x="80" y="64" fill="#4a2a3a" font-size="13" font-family="'SF Pro Display', system-ui" font-weight="600">Error</text>
  <text x="80" y="84" fill="#c485a3" font-size="10" font-family="'SF Mono', monospace">GitHub API service error. Please try again later.</text>
  <text x="80" y="104" fill="#e0b8cf" font-size="9" font-family="'SF Mono', monospace">Try again or check GitHub profile</text>
  <text x="460" y="148" fill="#e0b8cf" font-size="8" text-anchor="end" font-family="'SF Mono', monospace">GitHub Languages Card</text>
</svg>